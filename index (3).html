return Object.values(r.sc||{}).reduce((a,b)=>a+ +b,0)/((r.n||1)*(r.mx||db.set.max))*100}

rtl:[['guru','Guru','g'],['tgl','Jadwal pelaksanaan','d'],['temuan','Temuan hasil supervisi','a'],['aspek','Aspek yang diperbaiki','t'],['kegiatan','Bentuk kegiatan','s',['Pendampingan individu','Diskusi dengan rekan sejawat','Pelatihan/workshop','Observasi pembelajaran lanjutan','Pengembangan media pembelajaran','Perbaikan perangkat pembelajaran']],['tujuan','Tujuan perbaikan','t'],['pj','Penanggung jawab','t'],['target','Target','t'],['bukti','Bukti pelaksanaan','t'],['hasil','Hasil evaluasi tindak lanjut','a'],['st','Status','s',['Belum dilaksanakan','Sedang berjalan','Selesai']]]};

`<select onchange="fl.k=this.value;${f}"><option value="">Semua kelas</option>${ks.map(k=>`<option>${esc(k)}</option>`).join('')}</select>`+(v=='guru'?'':`Periode <input type=date onchange="fl.a=this.value;${f}"> s/d <input type=date onchange="fl.z=this.value;${f}">`)+`</div>`}

function del(v,id){if(!confirm('Hapus data ini? Tindakan tidak dapat dibatalkan.'))return;const s=S(v);db[s]=db[s].filter(x=>x.id!=id);

const p=pct(r,'nil');return `<h4>${T[r.inst]} – ${esc(r.tgl)} (${esc(r.sup)}${r.prd?', '+esc(r.prd):''})</h4><table><tr><th>No</th><th>Kelompok</th><th>Indikator</th><th>Skor</th><th>Bukti</th></tr>`+ind(r.inst).map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.g)}</td><td>${esc(x.i)}</td><td>${r.sc?.[i]??''}</td><td>${esc(r.ev?.[i])}</td></tr>`).join('')+`</table><p>Rekap: skor ${Object.values(r.sc||{}).reduce((a,b)=>a+b,0)} dari ${r.n*r.mx} = <b>${p.toFixed(1)}%</b> (${kat(p)})${X[r.inst].map(f=>'<br>'+f[1]+': '+esc(r[f[0]])).join('')}</p>${r.inst=='kom'?'<p><i>Instrumen internal sekolah, bukan penilaian resmi pemerintah.</i></p>':''}`}
function lapGuru(id){const g=db.guru.find(x=>x.id==id),my=s=>db[s].filter(r=>r.guru==id).sort((a,b)=>a.tgl>b.tgl?1:-1);
return hd()+`<h3 style="text-align:center">LAPORAN HASIL SUPERVISI GURU</h3><table><tr><td>Nama</td><td>${esc(g.nama)}</td><td>NIP/NUPTK</td><td>${esc(g.nip)}</td></tr><tr><td>Mata pelajaran</td><td>${esc(g.mapel)}</td><td>Kelas/fase</td><td>${esc(g.kelas)}</td></tr></table>`+my('per').map(r=>det(r,'per')).join('')+my('nil').map(r=>det(r,'nil')).join('')+(my('rtl').length?'<h4>Rencana Tindak Lanjut</h4>'+rtlT(my('rtl')):'')+ttd()}
function rekapRows(){const P=r=>(!fl.a||r.tgl>=fl.a)&&(!fl.z||r.tgl<=fl.z),av=(a,s)=>a.length?a.reduce((t,r)=>t+pct(r,s),0)/a.length:null;
return db.guru.filter(g=>!fl.k||g.kelas==fl.k).map(g=>{const m=s=>db[s].filter(r=>r.guru==g.id&&P(r)),n=m('nil'),o=n.filter(r=>r.inst=='obs'),u=n.filter(r=>r.inst=='sup'),p=m('per'),t=m('rtl'),k=n.filter(r=>r.inst=='kom');
return{g,o:av(o,'nil'),u:av(u,'nil'),p:av(p,'per'),n:o.length+u.length+p.length+k.length,k:av(k,'nil'),t:t.filter(x=>x.st=='Selesai').length+'/'+t.length}})}
const fm=x=>x==null?'-':x.toFixed(0)+'% ('+kat(x)+')',fp=x=>x==null?'-':x.toFixed(0)+'%';
const rkT=R=>`<table><tr><th>Guru</th><th>Mapel</th><th>Kelas</th><th>Jml kegiatan</th><th>Observasi</th><th>Supervisi akademik</th><th>Evaluasi kompetensi</th><th>Kelengkapan perangkat</th><th>RTL selesai</th></tr>`+R.map(x=>`<tr><td>${esc(x.g.nama)}</td><td>${esc(x.g.mapel)}</td><td>${esc(x.g.kelas)}</td><td>${x.n}</td><td>${fm(x.o)}</td><td>${fm(x.u)}</td><td>${fm(x.k)}</td><td>${fp(x.p)}</td><td>${x.t}</td></tr>`).join('')+'</table>';
const rk=()=>$('#tb').innerHTML=rkT(rekapRows());
function riw(){const id=fl.g,L=[];if(id){db.jadwal.filter(r=>r.guru==id).forEach(r=>L.push([r.tgl,'Jadwal: '+r.jenis,r.st]));db.per.filter(r=>r.guru==id).forEach(r=>L.push([r.tgl,'Pemeriksaan perangkat',fp(pct(r,'per'))]));db.nil.filter(r=>r.guru==id).forEach(r=>L.push([r.tgl,T[r.inst],fm(pct(r,'nil'))]));db.rtl.filter(r=>r.guru==id).forEach(r=>L.push([r.tgl,'RTL: '+r.aspek,r.st]))}
L.sort((a,b)=>(b[0]||'').localeCompare(a[0]||''));$('#tb').innerHTML=!id?'<p>Pilih guru untuk melihat riwayat.</p>':(L.length?`<table><tr><th>Tanggal</th><th>Kegiatan</th><th>Hasil/status</th></tr>${L.map(x=>`<tr>${x.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</table><p><button onclick="pr(lapGuru('${id}'))">Cetak laporan individu</button></p>`:'<p>Belum ada riwayat.</p>')}
const bk=()=>`<div class=warn>⚠ Data tersimpan di browser ini saja. ${db.last?'Backup terakhir: '+new Date(db.last).toLocaleDateString('id-ID')+'. ':'<b>Anda belum pernah backup.</b> '}Lakukan backup berkala. <button class="sm" onclick="exp()">Ekspor sekarang</button></div>`;
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,1)],{type:'application/json'}));a.download='backup-supervisi-'+today()+'.json';a.click();db.last=Date.now();save();go(cur)}
function imp(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(!j.guru||!j.set)throw 0;if(!confirm('Impor akan MENIMPA semua data saat ini. Lanjutkan?'))return;db=Object.assign(D0(),j);db.set=Object.assign(D0().set,j.set);save();go('dash')}catch(e){alert('File backup tidak valid.')}};r.readAsText(f)}
async function push(){const u=db.set.url;if(!u)return alert('Isi URL Apps Script terlebih dahulu.');try{const j=await(await fetch(u,{method:'POST',body:JSON.stringify(db)})).json();alert(j.ok?'Data berhasil dikirim ke Google Sheets.':'Gagal: '+j.err)}catch(e){alert('Gagal terhubung ke Google Sheets: '+e.message)}}
async function pull(){const u=db.set.url;if(!u)return alert('Isi URL Apps Script terlebih dahulu.');try{const j=await(await fetch(u)).json();if(!confirm('Data lokal akan ditimpa data dari Google Sheets. Lanjutkan?'))return;db=Object.assign(D0(),j);db.set=Object.assign(D0().set,j.set,{url:u});save();go('set')}catch(e){alert('Gagal mengambil data: '+e.message)}}
function setT(k,l,t='text'){return `<label>${l}<input type=${t} data-t=${k} value="${esc(db.set[k])}"></label>`}
function saveSet(){qa('#c [data-t]').forEach(e=>db.set[e.dataset.t]=e.value);const s=db.set;s.th=[+s.th0||85,+s.th1||70,+s.th2||55];delete s.th0;delete s.th1;delete s.th2;s.max=Math.max(2,Math.min(10,+s.max||4));save();alert('Pengaturan disimpan.');go('set')}
function resetAll(){if(confirm('Hapus SEMUA data di browser ini? Pastikan sudah backup.')&&confirm('Yakin? Ini tidak bisa dibatalkan.')){db=D0();save();go('dash')}}
function jbR(){const q=r=>(!fl.g||r.guru==fl.g)&&(!fl.m||r.tgl.slice(0,7)==fl.m),L0=db.jur.filter(q).sort((a,b)=>a.tgl>b.tgl?1:-1),M={};L0.forEach(r=>{const k=r.tgl.slice(0,7);(M[k]=M[k]||[]).push(r)});
const c=(a,k,x)=>a.filter(r=>r[k]==x).length;
return Object.keys(M).map(m=>{const a=M[m],L=(k,l)=>{const z=a.filter(r=>r[k]);return z.length?`<p><b>${l}</b></p><ul>${z.map(r=>`<li>${esc(r.tgl)}: ${fl.g?'':esc(gn(r.guru))+' – '}${esc(r[k])}</li>`).join('')}</ul>`:''};
return `<h4>${new Date(m+'-01T00:00:00').toLocaleDateString('id-ID',{month:'long',year:'numeric'})}</h4><table><tr><th>Jumlah jurnal</th><th>Tujuan tercapai (Ya/Sebagian/Belum)</th><th>Semua siswa terlibat (Ya/Sebagian/Tidak)</th></tr><tr><td>${a.length}</td><td>${c(a,'tercapai','Ya')}/${c(a,'tercapai','Sebagian')}/${c(a,'tercapai','Belum')}</td><td>${c(a,'terlibat','Ya')}/${c(a,'terlibat','Sebagian')}/${c(a,'terlibat','Tidak')}</td></tr></table>`+L('baik','Hal yang berjalan baik')+L('kendala','Kendala')+L('kesulitan','Kesulitan peserta didik')+L('strategi','Strategi yang perlu diperbaiki')+L('rencana','Rencana perbaikan')}).join('')||'<p>Belum ada jurnal pada filter ini.</p>'}
const jb=()=>$('#tb').innerHTML=jbR();
const V={jurbln(){return `<h2>Rekap Refleksi Bulanan</h2><div class=fb><select onchange="fl.g=this.value;jb()"><option value="">Semua guru</option>${db.guru.map(g=>`<option value=${g.id}>${esc(g.nama)}</option>`).join('')}</select><input type=month onchange="fl.m=this.value;jb()"></div><p><button onclick="pr(hd()+'<h3 style=text-align:center>REKAP REFLEKSI PEMBELAJARAN BULANAN</h3>'+(fl.g?'<p>Guru: '+esc(gn(fl.g))+'</p>':'')+jbR())">Cetak rekap</button></p><div class=ov id=tb></div>`},
dash(){const u=db.jadwal.filter(j=>j.st=='Terjadwal').sort((a,b)=>a.tgl>b.tgl?1:-1).slice(0,5),r=db.rtl;
return `<h2>Dashboard</h2>${bk()}<div class=st><div><b>${db.guru.length}</b>Guru</div><div><b>${db.jadwal.filter(j=>j.st=='Terjadwal').length}</b>Jadwal mendatang</div><div><b>${db.nil.length}</b>Penilaian supervisi</div><div><b>${db.per.length}</b>Perangkat diperiksa</div><div><b>${r.filter(x=>x.st=='Selesai').length}/${r.length}</b>RTL selesai</div></div><div class=card><b>Jadwal supervisi terdekat</b>${u.length?`<table>${u.map(j=>`<tr><td>${esc(j.tgl)} ${esc(j.jam)}</td><td>${esc(gn(j.guru))}</td><td>${esc(j.jenis)}</td></tr>`).join('')}</table>`:'<p>Belum ada jadwal.</p>'}</div>`+(db.set.sekolah?'':'<div class=card>Mulai dari menu <b>Pengaturan</b> untuk mengisi identitas sekolah, lalu tambahkan <b>Data Guru</b>.</div>')},
rekap(){return `<h2>Rekapitulasi Hasil Supervisi</h2>${fbar('rekap',1)}<p><button onclick="pr(hd()+'<h3 style=text-align:center>REKAPITULASI HASIL SUPERVISI</h3>'+rkT(rekapRows())+ttd())">Cetak laporan keseluruhan</button></p><div class=ov id=tb></div>`},
riwayat(){return `<h2>Riwayat Supervisi Guru</h2><div class=fb><select onchange="fl.g=this.value;riw()"><option value="">— pilih guru —</option>${db.guru.map(g=>`<option value=${g.id}>${esc(g.nama)}</option>`).join('')}</select></div><div class=ov id=tb></div>`},
set(){const s=db.set;return `<h2>Pengaturan</h2><div class=card><div class=g>${setT('app','Nama aplikasi')}${setT('sekolah','Nama sekolah')}${setT('npsn','NPSN')}<label>Jenjang<select data-t=jenjang>${'PAUD,TK,SD,SMP,SMA,SMK,MI,MTs,MA'.split(',').map(x=>`<option${s.jenjang==x?' selected':''}>${x}</option>`).join('')}</select></label>${setT('tp','Tahun pelajaran')}<label>Semester<select data-t=sem><option${s.sem=='Ganjil'?' selected':''}>Ganjil</option><option${s.sem=='Genap'?' selected':''}>Genap</option></select></label>${setT('kepsek','Nama kepala sekolah')}${setT('max','Skor maksimum per indikator (2–10)','number')}</div>
<div class=g><label>Batas Sangat Baik (%)<input type=number data-t=th0 value="${s.th[0]}"></label><label>Batas Baik (%)<input type=number data-t=th1 value="${s.th[1]}"></label><label>Batas Cukup (%)<input type=number data-t=th2 value="${s.th[2]}"></label></div><p style="color:var(--m);font-size:13px">Skala, batas kategori, dan indikator ini bukan standar resmi; sesuaikan dengan kebijakan sekolah. Perubahan indikator tidak mengubah data lama (skor lama mengikuti urutan indikator).</p>
<label>Indikator observasi pembelajaran (satu per baris: Kelompok|Indikator)<textarea data-t=obs rows=6>${esc(s.obs)}</textarea></label><br><label>Indikator supervisi akademik (satu per baris: Kelompok|Indikator)<textarea data-t=sup rows=6>${esc(s.sup)}</textarea></label><br><label>Indikator evaluasi kompetensi guru (Kelompok|Indikator)<textarea data-t=kom rows=6>${esc(s.kom)}</textarea></label><br><label>Daftar pemeriksaan perangkat (satu dokumen per baris)<textarea data-t=per rows=6>${esc(s.per)}</textarea></label></div>
<div class=card><b>Google Sheets</b><p style="color:var(--m);font-size:13px">Tempel URL Web App dari Apps Script (lihat Code.gs). Data tetap disimpan lokal; gunakan tombol berikut untuk sinkron.</p>${setT('url','URL Web App Apps Script')}<p><button class="b s" onclick="saveSet();push()">Kirim ke Google Sheets</button> <button class="b s" onclick="saveSet();pull()">Ambil dari Google Sheets</button></p></div>
<p><button onclick="saveSet()">Simpan pengaturan</button></p><div class=card><b>Backup data</b><p><button onclick="exp()">Ekspor data (.json)</button> <label class="b s" style="display:inline-block">Impor data<input type=file accept=".json" hidden onchange="imp(this.files[0])"></label> <button class="b r" onclick="resetAll()">Hapus semua data</button></p></div>`}};
const N=[['dash','Dashboard'],['guru','Data Guru'],['jadwal','Jadwal Supervisi'],['per','Pemeriksaan Perangkat'],['obs','Observasi Pembelajaran'],['sup','Supervisi Akademik'],['kom','Evaluasi Kompetensi'],['jur','Jurnal Refleksi'],['jurbln','Rekap Refleksi Bulanan'],['rtl','Tindak Lanjut (RTL)'],['riwayat','Riwayat Guru'],['rekap','Rekapitulasi'],['set','Pengaturan']];
$('#nv').innerHTML=N.map(n=>`<a data-v=${n[0]} onclick="go('${n[0]}')">${n[1]}</a>`).join('');
function go(v){cur=v;fl={q:'',g:'',k:'',a:'',z:'',m:''};$('#hT').textContent=db.set.app;$('#hS').textContent=[db.set.sekolah,db.set.tp&&'TP '+db.set.tp,db.set.sem&&'Semester '+db.set.sem].filter(Boolean).join(' · ');qa('nav a').forEach(a=>a.classList.toggle('on',a.dataset.v==v));
$('#c').innerHTML=(V[v]||(()=>lst(v)))();if(T[v]&&!['riwayat'].includes(v))tbl(v);if(v=='rekap')rk();if(v=='jurbln')jb();if(v=='riwayat')riw();scrollTo(0,0)}
go('dash');
</script></body></html>
